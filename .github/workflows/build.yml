name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app (unpacked)
        run: npx electron-builder --win --dir

      - name: Clean unnecessary files
        shell: bash
        run: |
          cd dist/win-unpacked
          rm -f ffmpeg.dll vk_swiftshader.dll d3dcompiler_47.dll
          rm -f libGLESv2.dll libEGL.dll vulkan-1.dll
          rm -f LICENSES.chromium.html chrome_200_percent.pak
          rm -f vk_swiftshader_icd.json
          # Keep only en-US locale
          cd locales && ls | grep -v en-US | xargs rm -f && cd ..
          echo "Cleaned build size: $(du -sh . | cut -f1)"

      - name: Create portable zip
        shell: bash
        run: |
          cd dist
          powershell -Command "Compress-Archive -Path 'win-unpacked' -DestinationPath 'PromptManager-Portable.zip' -CompressionLevel Optimal"

      - name: Build NSIS installer
        run: npx electron-builder --win nsis

      - name: Upload artifacts (on push to main)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: PromptManager-Windows
          path: |
            dist/Prompt Manager Setup *.exe
            dist/PromptManager-Portable.zip
          retention-days: 7

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Prompt Manager Setup *.exe
            dist/PromptManager-Portable.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
